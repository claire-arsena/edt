services:
  - type: web
    name: edt
    env: static
    branch: main
    autoDeploy: true
    # Le build récupère les flux .ics, génère les icônes, exporte le site
    # statique Expo dans dist/ puis complète index.html (PWA / iOS).
    buildCommand: npm install && npm run build:web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /apple-touch-icon.png
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /favicon.ico
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
